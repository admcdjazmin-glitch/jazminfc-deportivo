<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jazmín FC — Panel Deportivo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #0A1628;
  --navy2: #142040;
  --sky: #1E6FD9;
  --sky2: #4A9FD4;
  --gold: #C9A84C;
  --gold2: #F0C85A;
  --white: #FFFFFF;
  --gray1: #F4F6FA;
  --gray2: #E8ECF4;
  --gray3: #B0B8CC;
  --gray4: #6B7A99;
  --text: #0A1628;
  --text2: #4A5568;
  --green: #22C55E;
  --red: #EF4444;
  --amber: #F59E0B;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(10,22,40,0.10);
  --shadow-lg: 0 8px 32px rgba(10,22,40,0.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--gray1);color:var(--text);min-height:100vh}
button{font-family:'Poppins',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'Poppins',sans-serif;outline:none;border:1.5px solid var(--gray2);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;width:100%;background:var(--white);color:var(--text);transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--sky)}
textarea{resize:vertical;min-height:80px}

/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo .club-name{color:var(--white);font-size:16px;font-weight:700;letter-spacing:.5px}
.sidebar-logo .club-sub{color:var(--sky2);font-size:11px;margin-top:2px}
.sidebar-profile{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px}
.profile-avatar{width:36px;height:36px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--white);flex-shrink:0}
.profile-name{color:var(--white);font-size:13px;font-weight:500}
.profile-role{color:var(--sky2);font-size:11px}
.sidebar-nav{flex:1;padding:12px 12px;overflow-y:auto}
.nav-section{font-size:10px;color:var(--gray4);font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:12px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:rgba(255,255,255,0.65);font-size:13px;cursor:pointer;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,0.07);color:var(--white)}
.nav-item.active{background:var(--sky);color:var(--white);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-bottom{padding:12px 20px 20px;border-top:1px solid rgba(255,255,255,0.08)}
.logout-btn{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer;padding:8px 0;transition:color .15s}
.logout-btn:hover{color:var(--white)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--gray2);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:4px}
.page-title{font-size:18px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-date{font-size:12px;color:var(--text2)}
.topbar-badge{background:var(--sky);color:var(--white);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}

.content{flex:1;overflow-y:auto;padding:24px}

/* SCREENS */
.screen{display:none}
.screen.active{display:block}

/* LOGIN */
.login-page{min-height:100vh;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-logo{text-align:center;margin-bottom:40px}
.login-logo .emblem{width:72px;height:72px;background:var(--sky);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px;font-weight:700;color:var(--white)}
.login-logo h1{color:var(--white);font-size:22px;font-weight:700}
.login-logo p{color:var(--sky2);font-size:13px;margin-top:4px}
.login-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);padding:28px;width:100%;max-width:460px}
.login-card h2{color:var(--white);font-size:15px;font-weight:500;margin-bottom:20px;text-align:center}
.profes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.profe-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-sm);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .2s;color:var(--white)}
.profe-btn:hover{background:var(--sky);border-color:var(--sky);transform:translateY(-2px)}
.profe-btn .av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--white)}
.profe-btn .pn{font-size:13px;font-weight:600}
.profe-btn .pc{font-size:11px;color:var(--sky2);opacity:.8}
.admin-area{margin-top:16px;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-btn{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);border-radius:var(--radius-sm);padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s;color:var(--gold)}
.admin-btn:hover{background:rgba(201,168,76,0.25)}
.admin-btn .an{font-size:13px;font-weight:500}
.admin-btn .ar{font-size:11px;color:var(--gold2);opacity:.7}

/* CARDS */
.card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.card-title span{font-size:12px;font-weight:400;color:var(--text2)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--sky)}
.stat-card.gold{border-color:var(--gold)}
.stat-card.green{border-color:var(--green)}
.stat-card.red{border-color:var(--red)}
.stat-num{font-size:28px;font-weight:700;color:var(--text)}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px}
.stat-sub{font-size:11px;color:var(--sky);margin-top:2px;font-weight:500}

/* BUTTONS */
.btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--sky);color:var(--white)}
.btn-primary:hover{background:#1559b0}
.btn-gold{background:var(--gold);color:var(--white)}
.btn-gold:hover{background:#a8873a}
.btn-outline{background:transparent;border:1.5px solid var(--gray2);color:var(--text2)}
.btn-outline:hover{border-color:var(--sky);color:var(--sky)}
.btn-danger{background:var(--red);color:var(--white)}
.btn-sm{padding:6px 14px;font-size:12px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:10px 14px;border-bottom:2px solid var(--gray2);background:var(--gray1)}
td{padding:12px 14px;border-bottom:1px solid var(--gray2);font-size:13px;color:var(--text)}
tr:hover td{background:var(--gray1)}
.player-row-info{display:flex;align-items:center;gap:10px}
.player-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--white);flex-shrink:0}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:#DCFCE7;color:#15803D}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-amber{background:#FEF3C7;color:#92400E}
.badge-blue{background:#DBEAFE;color:#1D4ED8}
.badge-gray{background:var(--gray2);color:var(--text2)}

/* ASISTENCIA */
.asist-controls{display:flex;gap:6px}
.asist-btn{width:34px;height:34px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--gray2);background:var(--gray1);color:var(--text2);transition:all .15s}
.asist-btn.p-active{background:#DCFCE7;border-color:#22C55E;color:#15803D}
.asist-btn.t-active{background:#FEF3C7;border-color:#F59E0B;color:#92400E}
.asist-btn.a-active{background:#FEE2E2;border-color:#EF4444;color:#991B1B}
.asist-btn.e-active{background:#DBEAFE;border-color:#3B82F6;color:#1D4ED8}

/* PROGRESS */
.progress-bar{height:6px;background:var(--gray2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--sky);transition:width .4s}
.progress-fill.green{background:var(--green)}
.progress-fill.amber{background:var(--amber)}
.progress-fill.red{background:var(--red)}

/* FICHA */
.ficha-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);border-radius:var(--radius);padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:16px;color:var(--white)}
.ficha-foto{width:72px;height:72px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0;border:3px solid rgba(255,255,255,0.2)}
.ficha-name{font-size:20px;font-weight:700}
.ficha-meta{font-size:13px;color:var(--sky2);margin-top:4px}
.ficha-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.data-item{background:var(--gray1);border-radius:var(--radius-sm);padding:12px 14px}
.data-label{font-size:11px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.data-value{font-size:14px;font-weight:500;color:var(--text);margin-top:3px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,22,40,0.7);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:var(--radius);padding:24px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:17px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);line-height:1}
.form-row{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:var(--white);padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:2000;transform:translateY(100px);opacity:0;transition:all .3s;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#15803D}
.toast.error{background:#991B1B}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 24px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.3}
.empty-state h3{font-size:16px;font-weight:500;margin-bottom:6px}
.empty-state p{font-size:13px}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{padding-left:36px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray3)}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--gray1);padding:4px;border-radius:var(--radius-sm);margin-bottom:20px;width:fit-content}
.tab{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s}
.tab.active{background:var(--white);color:var(--text);box-shadow:var(--shadow)}

/* MOBILE */
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50}
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:100;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex}
  .mobile-overlay.show{display:block}
  .content{padding:16px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .profes-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){
  .stats-grid{grid-template-columns:1fr}
}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--text2);font-size:14px;gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--gray2);border-top-color:var(--sky);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:gap}
.section-title{font-size:20px;font-weight:700;color:var(--text)}
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginPage">
<div class="login-page">
  <div class="login-logo">
    <div class="emblem">JFC</div>
    <h1>Jazmín FC</h1>
    <p>More Than Just A Club · Soy de Cristo</p>
  </div>
  <div class="login-card">
    <h2>Selecciona tu perfil</h2>
    <div class="profes-grid" id="profesGrid"></div>
    <div class="admin-area" id="adminArea"></div>
  </div>
</div>
</div>

<!-- APP -->
<div id="appPage" style="display:none" class="app">
  <div class="mobile-overlay" id="mobileOverlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="club-name">⚽ Jazmín FC</div>
      <div class="club-sub">Panel Deportivo</div>
    </div>
    <div class="sidebar-profile">
      <div class="profile-avatar" id="sidebarAvatar">--</div>
      <div>
        <div class="profile-name" id="sidebarName">--</div>
        <div class="profile-role" id="sidebarRole">--</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-bottom">
      <div class="logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1628" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title" id="pageTitle">Dashboard</div>
      </div>
      <div class="topbar-right">
        <div class="topbar-date" id="topbarDate"></div>
        <div class="topbar-badge" id="topbarCat"></div>
      </div>
    </div>

    <div class="content">
      <!-- DASHBOARD -->
      <div class="screen active" id="screenDashboard">
        <div id="dashContent"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
      </div>

      <!-- ASISTENCIA -->
      <div class="screen" id="screenAsistencia">
        <div class="section-header">
          <div class="section-title">Asistencia del día</div>
          <button class="btn btn-primary btn-sm" onclick="saveAsistencia()">💾 Guardar todo</button>
        </div>
        <div id="asistContent"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
      </div>

      <!-- JUGADORES -->
      <div class="screen" id="screenJugadores">
        <div class="section-header">
          <div class="section-title">Jugadores</div>
          <button class="btn btn-primary btn-sm" onclick="openModalJugador()">+ Agregar jugador</button>
        </div>
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar jugador..." id="searchJugador" oninput="filterJugadores(this.value)"/>
        </div>
        <div id="jugadoresContent"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
      </div>

      <!-- FICHA JUGADOR -->
      <div class="screen" id="screenFicha">
        <div id="fichaContent"></div>
      </div>

      <!-- REPORTES -->
      <div class="screen" id="screenReportes">
        <div class="section-title" style="margin-bottom:20px">Reportes</div>
        <div id="reportesContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL JUGADOR -->
<div class="modal-overlay" id="modalJugador">
  <div class="modal">
    <div class="modal-title">
      <span id="modalJugadorTitle">Nuevo jugador</span>
      <button class="modal-close" onclick="closeModal('modalJugador')">✕</button>
    </div>
    <div class="tabs" style="margin-bottom:16px">
      <div class="tab active" onclick="switchTab(this,'tabDatos')">Datos</div>
      <div class="tab" onclick="switchTab(this,'tabDeportivo')">Deportivo</div>
    </div>
    <div id="tabDatos">
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Nombre completo *</label><input type="text" id="jNombre" placeholder="Juan García"/></div>
        <div class="form-row"><label class="form-label">Documento</label><input type="text" id="jDoc" placeholder="123456789"/></div>
        <div class="form-row"><label class="form-label">Fecha de nacimiento</label><input type="date" id="jFecha"/></div>
        <div class="form-row"><label class="form-label">Categoría *</label><select id="jCat"><option value="">Seleccionar...</option></select></div>
        <div class="form-row"><label class="form-label">Posición</label><select id="jPos"><option>Portero</option><option>Defensa</option><option>Mediocampista</option><option>Delantero</option></select></div>
        <div class="form-row"><label class="form-label">Pierna dominante</label><select id="jPierna"><option>Derecha</option><option>Izquierda</option><option>Ambas</option></select></div>
        <div class="form-row"><label class="form-label">Número camiseta</label><input type="number" id="jNum" min="1" max="99" placeholder="10"/></div>
        <div class="form-row"><label class="form-label">RH sanguíneo</label><select id="jRH"><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select></div>
        <div class="form-row"><label class="form-label">EPS</label><input type="text" id="jEPS" placeholder="Compensar"/></div>
        <div class="form-row"><label class="form-label">Acudiente</label><input type="text" id="jAcud" placeholder="Nombre del acudiente"/></div>
        <div class="form-row"><label class="form-label">Teléfono acudiente</label><input type="text" id="jTel" placeholder="300 123 4567"/></div>
        <div class="form-row"><label class="form-label">Dirección</label><input type="text" id="jDir" placeholder="Barrio Jazmín, Bogotá"/></div>
      </div>
      <div class="form-row"><label class="form-label">Observaciones médicas</label><textarea id="jObsMed" placeholder="Alergias, condiciones especiales..."></textarea></div>
    </div>
    <div id="tabDeportivo" style="display:none">
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Fortalezas</label><input type="text" id="jFort" placeholder="Velocidad, remate..."/></div>
        <div class="form-row"><label class="form-label">Áreas a mejorar</label><input type="text" id="jDebil" placeholder="Cabeceo, regate..."/></div>
      </div>
      <div class="form-row"><label class="form-label">Observaciones deportivas</label><textarea id="jObsDep" placeholder="Notas del entrenador..."></textarea></div>
    </div>
    <input type="hidden" id="jId"/>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-primary" onclick="saveJugador()" style="flex:1">Guardar jugador</button>
      <button class="btn btn-outline" onclick="closeModal('modalJugador')">Cancelar</button>
    </div>
  </div>
</div>

<script>

// ── ASISTENCIA ─────────────────────────────────────────────
async function loadAsistencia(){
  const el=document.getElementById('asistContent');
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando jugadores...</div>';
  try{
    let q=sb.from('jugadores').select('id,nombre,posicion,numero_camiseta,categoria').eq('activo',true).order('nombre');
    if(currentUser.rol==='profe')q=q.eq('categoria',currentUser.cat);
    const{data:jug,error}=await q;
    if(error)throw error;
    if(!jug||jug.length===0){el.innerHTML='<div class="empty-state"><div class="icon">👥</div><h3>Sin jugadores</h3><p>No hay jugadores en esta categoría</p></div>';return;}

    // Load today's records
    let qa=sb.from('asistencia').select('jugador_id,estado').eq('fecha',todayStr);
    if(currentUser.rol==='profe')qa=qa.eq('categoria',currentUser.cat);
    const{data:existing}=await qa;
    asistenciaHoy={};
    if(existing)existing.forEach(a=>{asistenciaHoy[a.jugador_id]=a.estado});

    const grupos={};
    jug.forEach(j=>{
      if(!grupos[j.categoria])grupos[j.categoria]=[];
      grupos[j.categoria].push(j);
    });

    let html='';
    Object.keys(grupos).sort().forEach(cat=>{
      const list=grupos[cat];
      html+=`<div class="card" style="margin-bottom:16px">
        <div class="card-title">${cat} <span>${list.length} jugadores</span></div>
        <div class="table-wrap"><table>
        <thead><tr><th style="width:40%">Jugador</th><th>Pos.</th><th>#</th><th>Asistencia</th></tr></thead>
        <tbody>`;
      list.forEach(j=>{
        const st=asistenciaHoy[j.id]||'';
        const ini=(j.nombre||'').split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
        html+=`<tr>
          <td><div class="player-row-info"><div class="player-avatar">${ini}</div>${j.nombre||'-'}</div></td>
          <td><span class="badge badge-gray">${j.posicion||'-'}</span></td>
          <td>${j.numero_camiseta||'-'}</td>
          <td><div class="asist-controls" id="ac-${j.id}">
            <button class="asist-btn ${st==='P'?'p-active':''}" onclick="setAsist('${j.id}','P',this,'${cat}')">P</button>
            <button class="asist-btn ${st==='T'?'t-active':''}" onclick="setAsist('${j.id}','T',this,'${cat}')">T</button>
            <button class="asist-btn ${st==='A'?'a-active':''}" onclick="setAsist('${j.id}','A',this,'${cat}')">A</button>
            <button class="asist-btn ${st==='E'?'e-active':''}" onclick="setAsist('${j.id}','E',this,'${cat}')">E</button>
          </div></td>
        </tr>`;
      });
      html+=`</tbody></table></div></div>`;
    });
    el.innerHTML=html;
  }catch(e){el.innerHTML=`<div class="card"><p style="color:var(--red)">Error: ${e.message}</p></div>`}
}

function setAsist(jugId,estado,btn,cat){
  asistenciaHoy[jugId]={estado,cat};
  const cont=document.getElementById('ac-'+jugId);
  cont.querySelectorAll('.asist-btn').forEach(b=>{b.classList.remove('p-active','t-active','a-active','e-active')});
  const map={P:'p-active',T:'t-active',A:'a-active',E:'e-active'};
  btn.classList.add(map[estado]);
}

async function saveAsistencia(){
  const records=Object.entries(asistenciaHoy).map(([jugador_id,v])=>({
    jugador_id,
    fecha:todayStr,
    estado:typeof v==='object'?v.estado:v,
    categoria:typeof v==='object'?v.cat:(currentUser.cat||'General'),
    registrado_por:currentUser.nombre
  }));
  if(!records.length){showToast('Marca al menos un jugador','error');return;}
  try{
    const{error}=await sb.from('asistencia').upsert(records,{onConflict:'jugador_id,fecha'});
    if(error)throw error;
    showToast(`✅ Asistencia guardada (${records.length} registros)`,'success');
  }catch(e){showToast('Error: '+e.message,'error')}
}

  const el=document.getElementById('jugadoresContent');

    let q=sb.from('jugadores').select('*').order('nombre');

  const el=document.getElementById('jugadoresContent');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="icon">👥</div><h3>Sin jugadores</h3><p>Agrega el primer jugador</p></div>';return;}
  let html=`<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Jugador</th><th>Categoría</th><th>Posición</th><th>#</th><th>Estado</th><th>Acción</th></tr></thead>
    <tbody>`;
  list.forEach(j=>{
    const ini=(j.nombre||'').split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
    const edad=j.fecha_nacimiento?Math.floor((new Date()-new Date(j.fecha_nacimiento))/31557600000):'--';
    html+=`<tr>
      <td><div class="player-row-info"><div class="player-avatar">${ini}</div><div><div style="font-weight:500">${j.nombre||'-'}</div><div style="font-size:11px;color:var(--text2)">${edad!='--'?edad+' años':''}</div></div></div></td>
      <td><span class="badge badge-blue">${j.categoria||'-'}</span></td>
      <td>${j.posicion||'-'}</td>
      <td style="font-weight:600">#${j.numero_camiseta||'-'}</td>
      <td><span class="badge ${j.activo===false?'badge-red':'badge-green'}">${j.activo===false?'Inactivo':'Activo'}</span></td>
      <td><button class="btn btn-outline btn-sm" onclick="verFicha('${j.id}')">Ver ficha</button></td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>`;
  el.innerHTML=html;
}

function filterJugadores(q){
  const filtered=allJugadores.filter(j=>(j.nombre||'').toLowerCase().includes(q.toLowerCase())||(j.categoria||'').toLowerCase().includes(q.toLowerCase()));
  renderJugadores(filtered);
}

    <div class="ficha-foto">${ini}</div>

      <div class="ficha-badges">

      </div>
    </div>
  </div>
  <div class="data-grid">
    <div class="data-item"><div class="data-label">Edad</div><div class="data-value">${edad} años</div></div>
    <div class="data-item"><div class="data-label">Documento</div><div class="data-value">${j.documento||'--'}</div></div>
    <div class="data-item"><div class="data-label">RH</div><div class="data-value">${j.rh||'--'}</div></div>
    <div class="data-item"><div class="data-label">EPS</div><div class="data-value">${j.eps||'--'}</div></div>

async function saveJugador(){
  const nombre=document.getElementById('jNombre').value.trim();
  const cat=document.getElementById('jCat').value;
  if(!nombre||!cat){showToast('Nombre y categoría son obligatorios','error');return;}
  const id=document.getElementById('jId').value;
  const data={
    nombre,
    documento:document.getElementById('jDoc').value||null,
    fecha_nacimiento:document.getElementById('jFecha').value||null,
    categoria:cat,
    posicion:document.getElementById('jPos').value,
    pierna_dominante:document.getElementById('jPierna').value,
    numero_camiseta:parseInt(document.getElementById('jNum').value)||null,
    rh:document.getElementById('jRH').value,
    eps:document.getElementById('jEPS').value||null,
    acudiente:document.getElementById('jAcud').value||null,
    telefono:document.getElementById('jTel').value||null,
    direccion:document.getElementById('jDir').value||null,
    obs_medicas:document.getElementById('jObsMed').value||null,
    fortalezas:document.getElementById('jFort').value||null,
    debilidades:document.getElementById('jDebil').value||null,
    obs_deportivas:document.getElementById('jObsDep').value||null,
    activo:true
  };
  try{
    let err;
    if(id){const r=await sb.from('jugadores').update(data).eq('id',id);err=r.error;}
    else{const r=await sb.from('jugadores').insert(data);err=r.error;}
    if(err)throw err;
    showToast(id?'✅ Jugador actualizado':'✅ Jugador agregado','success');
    closeModal('modalJugador');
    loadJugadores();
  }catch(e){showToast('Error: '+e.message,'error')}
}

// ── REPORTES ───────────────────────────────────────────────
async function loadReportes(){
  const el=document.getElementById('reportesContent');
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando...</div>';
  try{
    let qJug=sb.from('jugadores').select('id,nombre,categoria,activo');
    if(currentUser.rol==='profe')qJug=qJug.eq('categoria',currentUser.cat);
    const{data:jug}=await qJug;

    let qAsist=sb.from('asistencia').select('jugador_id,estado,fecha,categoria');
    if(currentUser.rol==='profe')qAsist=qAsist.eq('categoria',currentUser.cat);
    const{data:asist}=await qAsist;

    const catMap={};
    (jug||[]).forEach(j=>{
      if(!catMap[j.categoria])catMap[j.categoria]={total:0,activos:0};
      catMap[j.categoria].total++;
      if(j.activo!==false)catMap[j.categoria].activos++;
    });

    const pctPorJug={};
    (asist||[]).forEach(a=>{
      if(!pctPorJug[a.jugador_id])pctPorJug[a.jugador_id]={p:0,t:0};
      if(a.estado==='P')pctPorJug[a.jugador_id].p++;
      else if(a.estado==='T')pctPorJug[a.jugador_id].t++;
      pctPorJug[a.jugador_id].t=(pctPorJug[a.jugador_id].t||0);
    });

    const ranking=(jug||[]).map(j=>{
      const r=pctPorJug[j.id]||{p:0};
      const total=asist?asist.filter(a=>a.jugador_id===j.id).length:0;
      const pct=total>0?Math.round((r.p)/total*100):0;
      return{...j,pct,total};
    }).filter(j=>j.total>0).sort((a,b)=>b.pct-a.pct).slice(0,10);

    let rankHtml='';
    ranking.forEach((j,i)=>{
      const color=j.pct>=80?'green':j.pct>=60?'amber':'red';
      rankHtml+=`<tr>
        <td style="font-weight:600">#${i+1}</td>
        <td>${j.nombre}</td>
        <td><span class="badge badge-blue">${j.categoria}</span></td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="progress-bar" style="width:80px"><div class="progress-fill ${color}" style="width:${j.pct}%"></div></div>
            <span style="font-size:12px;font-weight:600">${j.pct}%</span>
          </div>
        </td>
      </tr>`;
    });

    let catHtml='';
    Object.entries(catMap).sort().forEach(([cat,d])=>{
      catHtml+=`<tr><td><span class="badge badge-blue">${cat}</span></td><td>${d.total}</td><td>${d.activos}</td></tr>`;
    });

    el.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="card-title">Jugadores por categoría</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Categoría</th><th>Total</th><th>Activos</th></tr></thead>
          <tbody>${catHtml||'<tr><td colspan="3" style="text-align:center;color:var(--text2)">Sin datos</td></tr>'}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-title">Top asistencia</div>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Jugador</th><th>Cat.</th><th>%</th></tr></thead>
          <tbody>${rankHtml||'<tr><td colspan="4" style="text-align:center;color:var(--text2)">Sin registros aún</td></tr>'}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">Resumen global</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${(jug||[]).length}</div><div class="stat-label">Total jugadores</div></div>
        <div class="stat-card green"><div class="stat-num">${(asist||[]).filter(a=>a.estado==='P').length}</div><div class="stat-label">Presencias registradas</div></div>
        <div class="stat-card red"><div class="stat-num">${(asist||[]).filter(a=>a.estado==='A').length}</div><div class="stat-label">Ausencias registradas</div></div>
        <div class="stat-card gold"><div class="stat-num">${(asist||[]).length}</div><div class="stat-label">Registros totales</div></div>
      </div>
    </div>`;
  }catch(e){el.innerHTML=`<div class="card"><p style="color:var(--red)">Error: ${e.message}</p></div>`}
}

// ── UTILS ──────────────────────────────────────────────────
function switchTab(btn,tabId){
  btn.closest('.tabs').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['tabDatos','tabDeportivo'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.style.display=id===tabId?'block':'none';
  });
}

function closeModal(id){document.getElementById(id).classList.remove('open')}

function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'');
  setTimeout(()=>t.className='toast',3500);
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mobileOverlay').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobileOverlay').classList.remove('show');
}

document.getElementById('topbarDate').textContent=todayLabel;
initLogin();
</script>
