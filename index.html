<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jazmín FC — Panel Deportivo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0A1628;--navy2:#142040;--sky:#1E6FD9;--sky2:#4A9FD4;
  --gold:#C9A84C;--gold2:#F0C85A;--white:#FFFFFF;
  --gray1:#F4F6FA;--gray2:#E8ECF4;--gray3:#B0B8CC;--gray4:#6B7A99;
  --text:#0A1628;--text2:#4A5568;
  --green:#22C55E;--red:#EF4444;--amber:#F59E0B;--purple:#7C3AED;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(10,22,40,0.10);--shadow-lg:0 8px 32px rgba(10,22,40,0.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--gray1);color:var(--text);min-height:100vh}
button{font-family:'Poppins',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'Poppins',sans-serif;outline:none;border:1.5px solid var(--gray2);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;width:100%;background:var(--white);color:var(--text);transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--sky)}
textarea{resize:vertical;min-height:80px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo .club-name{color:var(--white);font-size:16px;font-weight:700}
.sidebar-logo .club-sub{color:var(--sky2);font-size:11px;margin-top:2px}
.sidebar-profile{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px}
.profile-avatar{width:36px;height:36px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--white);flex-shrink:0;overflow:hidden}
.profile-name{color:var(--white);font-size:13px;font-weight:500}
.profile-role{font-size:11px;margin-top:1px}
.role-admin{color:#F0C85A}.role-coord{color:#A78BFA}.role-profe{color:var(--sky2)}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-section{font-size:10px;color:var(--gray4);font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:12px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:rgba(255,255,255,0.65);font-size:13px;cursor:pointer;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,0.07);color:var(--white)}
.nav-item.active{background:var(--sky);color:var(--white);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-bottom{padding:12px 20px 20px;border-top:1px solid rgba(255,255,255,0.08)}
.logout-btn{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer;padding:8px 0}
.logout-btn:hover{color:var(--white)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--gray2);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:4px}
.page-title{font-size:18px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-date{font-size:12px;color:var(--text2)}
.topbar-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}
.badge-admin{background:#FEF3C7;color:#92400E}
.badge-coord{background:#EDE9FE;color:#5B21B6}
.badge-profe{background:#DBEAFE;color:#1D4ED8}
.content{flex:1;overflow-y:auto;padding:24px}
.screen{display:none}.screen.active{display:block}

/* LOGIN */
.login-page{min-height:100vh;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo .emblem{width:72px;height:72px;background:var(--sky);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px;font-weight:700;color:var(--white)}
.login-logo h1{color:var(--white);font-size:22px;font-weight:700}
.login-logo p{color:var(--sky2);font-size:13px;margin-top:4px}
.login-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);padding:28px;width:100%;max-width:480px}
.login-section-title{color:rgba(255,255,255,0.4);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin:16px 0 10px}
.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login-btn{border-radius:var(--radius-sm);padding:14px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s;text-align:left;width:100%}
.login-btn-profe{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--white)}
.login-btn-profe:hover{background:var(--sky);border-color:var(--sky)}
.login-btn-admin{background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.3);color:var(--gold)}
.login-btn-admin:hover{background:rgba(201,168,76,0.25)}
.login-btn-coord{background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.3);color:#A78BFA}
.login-btn-coord:hover{background:rgba(124,58,237,0.25)}
.lb-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--white);flex-shrink:0}
.lb-name{font-size:13px;font-weight:600}
.lb-role{font-size:11px;opacity:.7;margin-top:1px}

/* CARDS */
.card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.card-title span{font-size:12px;font-weight:400;color:var(--text2)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--sky)}
.stat-card.gold{border-color:var(--gold)}.stat-card.green{border-color:var(--green)}.stat-card.red{border-color:var(--red)}.stat-card.purple{border-color:var(--purple)}
.stat-num{font-size:28px;font-weight:700;color:var(--text)}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px}
.stat-sub{font-size:11px;color:var(--sky);margin-top:2px;font-weight:500}
.btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--sky);color:var(--white)}.btn-primary:hover{background:#1559b0}
.btn-gold{background:var(--gold);color:var(--white)}.btn-gold:hover{background:#a8873a}
.btn-outline{background:transparent;border:1.5px solid var(--gray2);color:var(--text2)}.btn-outline:hover{border-color:var(--sky);color:var(--sky)}
.btn-danger{background:var(--red);color:var(--white)}.btn-danger:hover{background:#b91c1c}
.btn-dark-danger{background:#7f1d1d;color:var(--white)}.btn-dark-danger:hover{background:#5c1515}
.btn-success{background:var(--green);color:var(--white)}
.btn-purple{background:var(--purple);color:var(--white)}
.btn-sm{padding:6px 14px;font-size:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:10px 14px;border-bottom:2px solid var(--gray2);background:var(--gray1)}
td{padding:12px 14px;border-bottom:1px solid var(--gray2);font-size:13px;color:var(--text)}
tr:hover td{background:var(--gray1)}
.player-row-info{display:flex;align-items:center;gap:10px}
.player-avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--white);flex-shrink:0;overflow:hidden}
.player-avatar img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:#DCFCE7;color:#15803D}.badge-red{background:#FEE2E2;color:#991B1B}
.badge-amber{background:#FEF3C7;color:#92400E}.badge-blue{background:#DBEAFE;color:#1D4ED8}
.badge-gray{background:var(--gray2);color:var(--text2)}.badge-gold{background:#FEF3C7;color:#92400E}
.badge-purple{background:#EDE9FE;color:#5B21B6}
.asist-controls{display:flex;gap:6px}
.asist-btn{width:34px;height:34px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--gray2);background:var(--gray1);color:var(--text2);transition:all .15s}
.asist-btn.p-active{background:#DCFCE7;border-color:#22C55E;color:#15803D}
.asist-btn.t-active{background:#FEF3C7;border-color:#F59E0B;color:#92400E}
.asist-btn.a-active{background:#FEE2E2;border-color:#EF4444;color:#991B1B}
.asist-btn.e-active{background:#DBEAFE;border-color:#3B82F6;color:#1D4ED8}
.progress-bar{height:6px;background:var(--gray2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--sky);transition:width .4s}
.progress-fill.green{background:var(--green)}.progress-fill.amber{background:var(--amber)}.progress-fill.red{background:var(--red)}
.ficha-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);border-radius:var(--radius);padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:16px;color:var(--white)}
.ficha-foto-big{width:80px;height:80px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0;border:3px solid rgba(255,255,255,0.2);overflow:hidden;cursor:pointer;position:relative}
.ficha-foto-big img{width:100%;height:100%;object-fit:cover}
.ficha-foto-big .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;font-size:11px;border-radius:50%}
.ficha-foto-big:hover .overlay{display:flex}
.ficha-name{font-size:20px;font-weight:700}
.ficha-meta{font-size:13px;color:var(--sky2);margin-top:4px}
.ficha-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.data-item{background:var(--gray1);border-radius:var(--radius-sm);padding:12px 14px}
.data-label{font-size:11px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.data-value{font-size:14px;font-weight:500;color:var(--text);margin-top:3px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,22,40,0.7);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:var(--radius);padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:17px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);line-height:1}
.form-row{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:var(--white);padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:2000;transform:translateY(100px);opacity:0;transition:all .3s;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#15803D}.toast.error{background:#991B1B}
.empty-state{text-align:center;padding:48px 24px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.3}
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{padding-left:36px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray3)}
.tabs{display:flex;gap:4px;background:var(--gray1);padding:4px;border-radius:var(--radius-sm);margin-bottom:20px;width:fit-content}
.tab{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s}
.tab.active{background:var(--white);color:var(--text);box-shadow:var(--shadow)}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50}
.foto-upload-area{width:90px;height:90px;border-radius:50%;border:2px dashed var(--gray3);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;flex-shrink:0}
.foto-upload-area:hover{border-color:var(--sky)}
.foto-upload-area img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.foto-upload-area .placeholder{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gray3);font-size:11px}
/* CALENDARIO */
.cal-wrap{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-title{font-size:16px;font-weight:600}
.cal-nav button{background:var(--gray1);border:none;border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);margin-left:6px}
.cal-nav button:hover{background:var(--gray2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-name{text-align:center;font-size:11px;font-weight:600;color:var(--text2);padding:6px 0;text-transform:uppercase}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:500;position:relative;transition:background .15s}
.cal-day:hover{background:var(--gray2)}
.cal-day.other-month{color:var(--gray3)}
.cal-day.today{background:var(--sky);color:var(--white);font-weight:700}
.cal-day.selected{background:var(--navy);color:var(--white)}
.cal-day.has-data::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);position:absolute;bottom:3px}
.cal-day.today.has-data::after,.cal-day.selected.has-data::after{background:rgba(255,255,255,0.7)}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--gray2);background:var(--white);color:var(--text2);transition:all .15s}
.filter-btn.active{background:var(--navy);color:var(--white);border-color:var(--navy)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-title{font-size:20px;font-weight:700;color:var(--text)}
/* ADMIN PROFES */
.profe-card-admin{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;margin-bottom:12px}
.profe-card-admin .av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--white);flex-shrink:0}
.profe-info{flex:1}
.profe-info .nombre{font-size:15px;font-weight:600}
.profe-info .cats{font-size:12px;color:var(--text2);margin-top:3px}
.profe-actions{display:flex;gap:8px}
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--text2);font-size:14px;gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--gray2);border-top-color:var(--sky);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.confirm-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--radius-sm);padding:14px;margin-top:12px;display:none}
.confirm-box.show{display:block}
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:100;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex}
  .mobile-overlay.show{display:block}
  .content{padding:16px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .login-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){.stats-grid{grid-template-columns:1fr}.login-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginPage">
<div class="login-page">
  <div class="login-logo">
    <div class="emblem">JFC</div>
    <h1>Jazmín FC</h1>
    <p>More Than Just A Club · Soy de Cristo</p>
  </div>
  <div class="login-card">
    <!-- ADMINS -->
    <div class="login-section-title">⭐ Dirección y Administración</div>
    <div class="login-grid" id="adminGrid"></div>
    <!-- COORDINADORA -->
    <div class="login-section-title">🎯 Coordinación Deportiva</div>
    <div id="coordGrid"></div>
    <!-- PROFES -->
    <div class="login-section-title">📋 Profesores</div>
    <div class="login-grid" id="profesGrid"></div>
  </div>
</div>
</div>

<!-- APP -->
<div id="appPage" style="display:none" class="app">
  <div class="mobile-overlay" id="mobileOverlay" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="club-name">⚽ Jazmín FC</div>
      <div class="club-sub">Panel Deportivo</div>
    </div>
    <div class="sidebar-profile">
      <div class="profile-avatar" id="sidebarAvatar"></div>
      <div>
        <div class="profile-name" id="sidebarName"></div>
        <div class="profile-role" id="sidebarRole"></div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-bottom">
      <div class="logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cambiar de perfil
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1628" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title" id="pageTitle">Dashboard</div>
      </div>
      <div class="topbar-right">
        <div style="font-size:12px;color:var(--text2)" id="topbarDate"></div>
        <div class="topbar-badge" id="topbarBadge"></div>
      </div>
    </div>
    <div class="content">
      <div class="screen active" id="screenDashboard"><div id="dashContent"><div class="loading"><div class="spinner"></div>Cargando...</div></div></div>
      <div class="screen" id="screenAsistencia"><div id="asistContent"></div></div>
      <div class="screen" id="screenJugadores">
        <div class="section-header">
          <div class="section-title">Jugadores</div>
          <div id="btnAgregarJugador"></div>
        </div>
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar por nombre o año..." id="searchJugador" oninput="filterJugadores(this.value)"/>
        </div>
        <div id="jugadoresContent"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div class="screen" id="screenFicha"><div id="fichaContent"></div></div>
      <div class="screen" id="screenReportes"><div id="reportesContent"></div></div>
      <div class="screen" id="screenProfes"><div id="profesContent"></div></div>
    </div>
  </div>
</div>

<!-- MODAL JUGADOR -->
<div class="modal-overlay" id="modalJugador">
  <div class="modal">

  if(nav)nav.classList.add('active');
  document.getElementById('pageTitle').textContent=name==='Profes'?'Gestión de profes':name;
  if(name==='Dashboard')await loadDashboard();
  else if(name==='Asistencia')await loadAsistencia();
  else if(name==='Jugadores')await initJugadores();
  else if(name==='Reportes')await loadReportes();
  else if(name==='Profes')loadProfes();
}

    const total=jug?jug.length:0;
    const pres=asist?asist.filter(a=>a.estado==='P'||a.estado==='T').length:0;
    const aus=asist?asist.filter(a=>a.estado==='A').length:0;

          <button class="btn btn-outline" onclick="showScreen('Jugadores')" style="justify-content:flex-start">👤 Ver jugadores</button>

          ${perm('verProfes')?`<button class="btn btn-outline" onclick="showScreen('Profes')" style="justify-content:flex-start">👥 Gestionar profes</button>`:''}
        </div>
      </div>
      <div class="card">
        <div class="card-title">Hoy <span>${todayLabel}</span></div>

        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;color:var(--text2)"><span>Asistencia</span><span>${pct}%</span></div>
          <div class="progress-bar"><div class="progress-fill ${pct>=80?'green':pct>=60?'amber':'red'}" style="width:${pct}%"></div></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="badge badge-green">✓ ${pres} presentes</span>

// ── ASISTENCIA ────────────────────────────────────────────
async function loadAsistencia(){
  document.getElementById('asistContent').innerHTML='<div class="loading"><div class="spinner"></div></div>';
  await loadDiasConRegistro();
  renderAsistenciaPage();
}
async function loadDiasConRegistro(){
  try{
    let q=sb.from('asistencia').select('fecha').gte('fecha',`${calYear}-${String(calMonth+1).padStart(2,'0')}-01`).lte('fecha',`${calYear}-${String(calMonth+1).padStart(2,'0')}-31`);
    if(!perm('verTodas'))q=q.in('anio_nacimiento',currentUser.anios.map(String));
    const{data}=await q;
    diasConRegistro=new Set((data||[]).map(d=>d.fecha));
  }catch(e){}
}
function renderAsistenciaPage(){
  document.getElementById('asistContent').innerHTML=`
  <div class="section-header">
    <div class="section-title">Asistencia</div>
    <button class="btn btn-primary btn-sm" onclick="saveAsistencia()">💾 Guardar</button>
  </div>
  <div class="cal-wrap">
    <div class="cal-header">
      <div class="cal-title" id="calTitle"></div>
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">‹ Anterior</button>
        <button onclick="changeMonth(1)">Siguiente ›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div id="asistDaySection"></div>`;
  renderCalendar();
  loadAsistenciaDia(selectedCalDate);
}
function renderCalendar(){
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('calTitle').textContent=`${meses[calMonth]} ${calYear}`;
  const grid=document.getElementById('calGrid');
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  let html=dias.map(d=>`<div class="cal-day-name">${d}</div>`).join('');
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  for(let i=0;i<firstDay;i++)html+=`<div class="cal-day other-month">${prevDays-firstDay+1+i}</div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=['cal-day',ds===todayStr?'today':'',ds===selectedCalDate?'selected':'',diasConRegistro.has(ds)?'has-data':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}" onclick="selectCalDay('${ds}')">${d}</div>`;
  }
  const rem=42-firstDay-daysInMonth;
  for(let i=1;i<=rem;i++)html+=`<div class="cal-day other-month">${i}</div>`;
  grid.innerHTML=html;
}
async function changeMonth(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  await loadDiasConRegistro();
  renderCalendar();
}
async function selectCalDay(ds){selectedCalDate=ds;renderCalendar();await loadAsistenciaDia(ds);}
async function loadAsistenciaDia(ds){
  const sec=document.getElementById('asistDaySection');
  if(!sec)return;
  const label=new Date(ds+'T12:00:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  sec.innerHTML=`<div style="font-size:15px;font-weight:600;margin-bottom:12px">📅 ${label}</div><div class="loading"><div class="spinner"></div></div>`;
  try{
    let q=sb.from('jugadores').select('id,nombre,posicion,numero_camiseta,anio_nacimiento,foto_url').eq('activo',true).order('anio_nacimiento').order('nombre');
    if(!perm('verTodas'))q=q.in('anio_nacimiento',currentUser.anios.map(String));
    const{data:jug,error}=await q;
    if(error)throw error;
    if(!jug||!jug.length){sec.innerHTML='<div class="empty-state"><div class="icon">👥</div><h3>Sin jugadores</h3></div>';return;}
    let qa=sb.from('asistencia').select('jugador_id,estado').eq('fecha',ds);

async function saveAsistencia(){

async function confirmarInactivar(id,nombre){
  if(!confirm(`¿Inactivar a ${nombre}? Podrá reactivarlo después.`))return;
  try{
    const{error}=await sb.from('jugadores').update({activo:false}).eq('id',id);
    if(error)throw error;
    showToast(`✅ ${nombre} inactivado`,'success');
    loadJugadores();
  }catch(e){showToast('Error: '+e.message,'error')}
}
async function eliminarJugador(id,nombre){
  if(!confirm('ELIMINAR a '+nombre+'?\n\nEsta accion NO se puede deshacer.'))return;
  try{
    await sb.from('asistencia').delete().eq('jugador_id',id);
    const{error}=await sb.from('jugadores').delete().eq('id',id);
    if(error)throw error;
    showToast('Eliminado: '+nombre,'success');loadJugadores();
  }catch(e){showToast('Error: '+e.message,'error')}
}
async function moverJugador(id){
  const j=allJugadores.find(x=>x.id===id);
  if(!j)return;
  const todos=[2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,'Femenino'];
  const nuevo=prompt(`Mover a ${j.nombre}\nAño actual: ${j.anio_nacimiento}\n\nEscribe el nuevo año:\n(${todos.join(', ')})`);
  if(!nuevo)return;
  if(!todos.map(String).includes(nuevo)){showToast('Año no válido','error');return;}
  try{
    const{error}=await sb.from('jugadores').update({anio_nacimiento:nuevo,categoria:anioACategoria(nuevo)}).eq('id',id);
    if(error)throw error;
    showToast(`✅ ${j.nombre} movido al año ${nuevo}`,'success');
    loadJugadores();
  }catch(e){showToast('Error: '+e.message,'error')}
}

      ${canEdit?`<div class="overlay">📷 Cambiar</div>`:''}
    </div>
    <div>
      <div class="ficha-name">${j.nombre||'Sin nombre'}</div>
      <div class="ficha-meta">${j.posicion||'-'} · Año ${j.anio_nacimiento||'-'} · #${j.numero_camiseta||'-'}</div>
      <div class="ficha-badges">
        <span class="badge badge-green">Activo</span>
        ${j.pierna_dominante?`<span class="badge badge-blue">Pie ${j.pierna_dominante}</span>`:''}
        ${j.rh?`<span class="badge badge-gray">RH ${j.rh}</span>`:''}
      </div>
    </div>
  </div>
  <input type="file" id="fichaFotoInput" accept="image/*" style="display:none" onchange="uploadFichaFoto(this,'${id}')"/>
  <div class="data-grid">

    <div class="data-item"><div class="data-label">Documento</div><div class="data-value">${j.documento||'--'}</div></div>
    <div class="data-item"><div class="data-label">EPS</div><div class="data-value">${j.eps||'--'}</div></div>
    <div class="data-item"><div class="data-label">Acudiente</div><div class="data-value">${j.acudiente||'--'}</div></div>
    <div class="data-item"><div class="data-label">Teléfono</div><div class="data-value">${j.telefono||'--'}</div></div>
    <div class="data-item"><div class="data-label">Dirección</div><div class="data-value">${j.direccion||'--'}</div></div>
    <div class="data-item"><div class="data-label">Asistencia</div><div class="data-value">${asistPct} <span style="font-size:11px;color:var(--text2)">(${pres}/${total})</span></div></div>
    <div class="data-item"><div class="data-label">RH</div><div class="data-value">${j.rh||'--'}</div></div>
  </div>
  ${j.obs_medicas?`<div class="card" style="margin-bottom:12px"><div class="card-title">Estado médico</div><p style="font-size:14px">${j.obs_medicas}</p></div>`:''}
  ${j.fortalezas||j.debilidades?`<div class="data-grid">
    ${j.fortalezas?`<div class="data-item"><div class="data-label">Fortalezas</div><div class="data-value">${j.fortalezas}</div></div>`:''}
    ${j.debilidades?`<div class="data-item"><div class="data-label">Áreas a mejorar</div><div class="data-value">${j.debilidades}</div></div>`:''}

  </div>`;

  document.getElementById('pageTitle').textContent=j.nombre;

function cambiarFoto(id){document.getElementById('fichaFotoInput').click();}
async function uploadFichaFoto(input,id){
  const file=input.files[0];if(!file)return;
  showToast('Subiendo foto...','');
  try{
    const ext=file.name.split('.').pop();
    const path=`jugadores/${id}.${ext}`;
    const{error:upErr}=await sb.storage.from('fotos').upload(path,file,{upsert:true});
    if(upErr)throw upErr;
    const{data:ud}=sb.storage.from('fotos').getPublicUrl(path);
    const{error:dbErr}=await sb.from('jugadores').update({foto_url:ud.publicUrl}).eq('id',id);
    if(dbErr)throw dbErr;
    const idx=allJugadores.findIndex(j=>j.id===id);
    if(idx>=0)allJugadores[idx].foto_url=ud.publicUrl;
    showToast('✅ Foto actualizada','success');
    verFicha(id);
  }catch(e){showToast('Error: '+e.message,'error')}
}

async function saveJugador(){
  const nombre=document.getElementById('jNombre').value.trim();
  const anio=document.getElementById('jAnio').value;
  if(!nombre||!anio){showToast('Nombre y año son obligatorios','error');return;}
  const id=document.getElementById('jId').value;
  const data={nombre,documento:document.getElementById('jDoc').value||null,anio_nacimiento:anio,categoria:anioACategoria(anio),posicion:document.getElementById('jPos').value,pierna_dominante:document.getElementById('jPierna').value,numero_camiseta:parseInt(document.getElementById('jNum').value)||null,rh:document.getElementById('jRH').value,eps:document.getElementById('jEPS').value||null,acudiente:document.getElementById('jAcud').value||null,telefono:document.getElementById('jTel').value||null,direccion:document.getElementById('jDir').value||null,obs_medicas:document.getElementById('jObsMed').value||null,fortalezas:document.getElementById('jFort').value||null,debilidades:document.getElementById('jDebil').value||null,activo:true};
  try{
    let savedId=id;
    if(id){const r=await sb.from('jugadores').update(data).eq('id',id);if(r.error)throw r.error;}
    else{const r=await sb.from('jugadores').insert(data).select();if(r.error)throw r.error;savedId=r.data[0].id;}
    const fotoFile=document.getElementById('fotoInput').files[0];
    if(fotoFile&&savedId){
      const ext=fotoFile.name.split('.').pop();
      const path=`jugadores/${savedId}.${ext}`;
      const{error:upErr}=await sb.storage.from('fotos').upload(path,fotoFile,{upsert:true});
      if(!upErr){const{data:ud}=sb.storage.from('fotos').getPublicUrl(path);await sb.from('jugadores').update({foto_url:ud.publicUrl}).eq('id',savedId);}
    }
    showToast(id?'✅ Jugador actualizado':'✅ Jugador agregado','success');
    closeModal('modalJugador');loadJugadores();
  }catch(e){showToast('Error: '+e.message,'error')}
}

async function loadReportes(){
  document.getElementById('reportesContent').innerHTML=`
  <div class="section-title" style="margin-bottom:16px">Reportes de asistencia</div>
  <div class="filter-row" style="margin-bottom:8px">
    <button class="filter-btn active" onclick="setFiltro('hoy',this)">Hoy</button>
    <button class="filter-btn" onclick="setFiltro('semana',this)">Esta semana</button>
    <button class="filter-btn" onclick="setFiltro('mes',this)">Este mes</button>
    <button class="filter-btn" onclick="setFiltro('todo',this)">Todo</button>
  </div>
  <div class="filter-row" id="filtroAnioRow" style="margin-bottom:16px"></div>
  <div id="reporteTabla"><div class="loading"><div class="spinner"></div></div></div>`;
  await cargarReporte('hoy');
  buildFiltroAnios();
}
function buildFiltroAnios(){
  const row=document.getElementById('filtroAnioRow');
  if(!row)return;
  const anios=currentUser.rol==='profe'?currentUser.anios:[2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,'Femenino'];
  let html='<span style="font-size:12px;color:var(--text2);padding:6px 4px;font-weight:500">Año:</span>';
  html+='<button class="filter-btn active" onclick="setAnioFiltro(null,this)">Todos</button>';
  anios.forEach(a=>{html+=`<button class="filter-btn" onclick="setAnioFiltro('${a}',this)">${a}</button>`;});
  row.innerHTML=html;
}
let currentAnioFiltro=null;
async function setAnioFiltro(anio,btn){
  currentAnioFiltro=anio;
  document.querySelectorAll('#filtroAnioRow .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const activePeriodo=document.querySelector('.filter-row .filter-btn.active');
  const filtro=activePeriodo?activePeriodo.textContent.trim():'Hoy';
  const map={'Hoy':'hoy','Esta semana':'semana','Este mes':'mes','Todo':'todo'};
  await cargarReporte(map[filtro]||'hoy');
}
async function setFiltro(f,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  await cargarReporte(f);
}
async function cargarReporte(filtro){
  const el=document.getElementById('reporteTabla');
  el.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  try{
    const hoy=new Date();
    let desde=todayStr;
    if(filtro==='semana'){const l=new Date(hoy);l.setDate(hoy.getDate()-hoy.getDay()+1);desde=l.toISOString().split('T')[0];}
    else if(filtro==='mes'){desde=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-01`;}
    else if(filtro==='todo'){desde='2024-01-01';}

    let qJ=sb.from('jugadores').select('id,nombre,anio_nacimiento').eq('activo',true).order('anio_nacimiento').order('nombre');
    if(!perm('verTodas'))qJ=qJ.in('anio_nacimiento',currentUser.anios.map(String));
    if(currentAnioFiltro)qJ=qJ.eq('anio_nacimiento',String(currentAnioFiltro));
    const{data:jug}=await qJ;

    let qA=sb.from('asistencia').select('jugador_id,estado,fecha').gte('fecha',desde).lte('fecha',todayStr);
    if(!perm('verTodas'))qA=qA.in('anio_nacimiento',currentUser.anios.map(String));
    if(currentAnioFiltro)qA=qA.eq('anio_nacimiento',String(currentAnioFiltro));
    const{data:asist}=await qA;

    const dias=[...new Set((asist||[]).map(a=>a.fecha))].sort();
    const resumen=(jug||[]).map(j=>{
      const regs=(asist||[]).filter(a=>a.jugador_id===j.id);
      const p=regs.filter(a=>a.estado==='P').length;
      const t=regs.filter(a=>a.estado==='T').length;
      const a=regs.filter(a=>a.estado==='A').length;
      const e=regs.filter(a=>a.estado==='E').length;
      const tot=regs.length;
      const pct=tot>0?Math.round((p+t)/tot*100):null;
      return{...j,p,t,a,e,tot,pct};
    }).filter(j=>j.tot>0).sort((a,b)=>(b.pct||0)-(a.pct||0));

    let html=`<div class="stats-grid" style="margin-bottom:16px">
      <div class="stat-card"><div class="stat-num">${(jug||[]).length}</div><div class="stat-label">Jugadores</div></div>
      <div class="stat-card green"><div class="stat-num">${dias.length}</div><div class="stat-label">Días registrados</div></div>
      <div class="stat-card gold"><div class="stat-num">${(asist||[]).filter(a=>a.estado==='P').length}</div><div class="stat-label">Presencias</div></div>
      <div class="stat-card red"><div class="stat-num">${(asist||[]).filter(a=>a.estado==='A').length}</div><div class="stat-label">Ausencias</div></div>
    </div>`;

    if(resumen.length){
      html+=`<div class="card" style="margin-bottom:16px">
        <div class="card-title">Por jugador</div>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Jugador</th><th>Año</th><th>P</th><th>T</th><th>A</th><th>E</th><th>%</th></tr></thead><tbody>`;
      resumen.forEach((j,i)=>{
        const cl=j.pct>=80?'badge-green':j.pct>=60?'badge-amber':'badge-red';
        html+=`<tr><td style="color:var(--text2);font-size:12px">${i+1}</td>
          <td style="font-weight:500">${j.nombre}</td>
          <td><span class="badge badge-blue">${j.anio_nacimiento||'-'}</span></td>
          <td>${j.p}</td><td>${j.t}</td><td>${j.a}</td><td>${j.e}</td>
          <td><span class="badge ${cl}">${j.pct}%</span></td></tr>`;
      });
      html+=`</tbody></table></div></div>`;
    }

    if(dias.length){
      html+=`<div class="card">
        <div class="card-title">Por fecha</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Fecha</th><th>Presentes</th><th>Tarde</th><th>Ausentes</th><th>Excusa</th><th>Total</th></tr></thead><tbody>`;
      dias.forEach(fecha=>{
        const reg=(asist||[]).filter(a=>a.fecha===fecha);
        const p=reg.filter(a=>a.estado==='P').length;
        const t=reg.filter(a=>a.estado==='T').length;
        const a=reg.filter(a=>a.estado==='A').length;
        const e=reg.filter(a=>a.estado==='E').length;
        const lbl=new Date(fecha+'T12:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
        html+=`<tr><td style="font-weight:500">${lbl}</td><td>${p}</td><td>${t}</td><td>${a}</td><td>${e}</td><td>${reg.length}</td></tr>`;
      });
      html+=`</tbody></table></div></div>`;
    }

    if(!resumen.length&&!dias.length)html+='<div class="empty-state"><div class="icon">📊</div><h3>Sin datos en este período</h3></div>';
    el.innerHTML=html;
  }catch(e){el.innerHTML=`<div class="card"><p style="color:var(--red)">Error: ${e.message}</p></div>`}
}

// ── UTILS ─────────────────────────────────────────────────
function switchTab(btn,tabId){
  btn.closest('.tabs').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['tabDatos','tabDeportivo'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=id===tabId?'block':'none';});
}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'');
  setTimeout(()=>t.className='toast',3500);
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobileOverlay').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');}
document.getElementById('topbarDate').textContent=todayLabel;
initLogin();
